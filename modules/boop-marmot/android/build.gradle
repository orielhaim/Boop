plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.boop'
version = '1.0.0'

def patch = file('../mdk-0.19.0.patch')
def revision = java.security.MessageDigest.getInstance('SHA-256').digest(patch.bytes).encodeHex().toString()
def sdk = file("../sdk/marmotkit-android-0.19.0-boop-${revision.take(12)}")
def prepareMarmotKit = tasks.register('prepareMarmotKit', Exec) {
  workingDir file('../../..')
  commandLine 'bun', 'scripts/fetch-marmotkit.ts', 'android',
    project.findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64'
}

android {
  namespace 'app.boop.marmot'
  sourceSets.main.java.srcDir(sdk.toPath().resolve('kotlin').toFile())
  sourceSets.main.jniLibs.srcDir(sdk.toPath().resolve('jniLibs').toFile())
  defaultConfig.consumerProguardFiles('marmot.pro')
  defaultConfig.testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
}

tasks.named('preBuild') { dependsOn prepareMarmotKit }

dependencies {
  implementation 'net.java.dev.jna:jna:5.18.1@aar'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'junit:junit:4.13.2'
}
